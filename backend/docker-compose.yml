services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: top
      POSTGRES_PASSWORD: top
      POSTGRES_DB: top
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U top -d top"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-topminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-topminiosecret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:9000/minio/health/live",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:latest
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >
        mc alias set local http://minio:9000
        "$${MINIO_ROOT_USER}"
        "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing local/top-resource-images
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-topminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-topminiosecret}

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://top:top@postgres:5432/top?schema=public
      PORT: 3000
      CORS_ORIGIN: http://localhost:3001
      JWT_ACCESS_SECRET: top-local-development-secret-change-in-production
      REFRESH_TOKEN_TTL_SECONDS: 2592000

      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: top-resource-images
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-topminio}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-topminiosecret}
      S3_FORCE_PATH_STYLE: "true"

    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    command:
      [
        "sh",
        "-c",
        "npx prisma migrate deploy && npm run start",
      ]

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:3000/api
        VITE_DEV_BUSINESS_ID: ${VITE_DEV_BUSINESS_ID:-}
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      - api

volumes:
  postgres_data:
  minio_data:

name: Backend CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - develop
      - qa
      - main
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 0'
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - name: Test safe Finance CI diagnostics
        run: node --test ../scripts/qa/Finance-CI-Resources.test.cjs
      - name: Prepare own Finance CI resources
        run: node ../scripts/qa/Finance-CI-Resources.cjs start
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm test
      - run: npm run test:integration
      - run: npm run test:e2e -- --runInBand
      - run: npm run test:acceptance
      - run: npm run test:coverage
      - run: npm run test:coverage:core
      - run: npm run architecture:check
      - run: npx prisma validate
      - run: npm run build
      - name: Cleanup own Finance CI resources
        if: always()
        run: node ../scripts/qa/Finance-CI-Resources.cjs cleanup
  mutation:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    env:
      JWT_ACCESS_SECRET: ci-only-jwt-access-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run test:mutation
      - run: npm run test:mutation:finance
